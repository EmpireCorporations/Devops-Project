
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Parking Tracker</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eef2f7;
            margin: 0;
            padding: 30px;
        }

        header {
            background: #172b4d;
            color: white;
            padding: 25px;
            border-radius: 12px;
            text-align: center;
        }

        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .car {
            background: white;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 3px 10px #0002;
        }

        .car img {
            width: 100%;
            height: 170px;
            object-fit: cover;
            border-radius: 8px;
        }

        .status {
            color: green;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <header>
        <h1>Smart Parking Tracker</h1>
        <p>Parking Security Dashboard</p>
    </header>

    <main class="dashboard">

        <div class="car">
            <img src="http://localhost:8081/images/car1.jpg"
                 alt="Car 1">
            <h3>Vehicle #1</h3>
            <p>License Plate: 123-45-678</p>
            <p class="status">Inside Parking</p>
        </div>

        <div class="car">
            <img src="http://localhost:8081/images/car2.jpg"
                 alt="Car 2">
            <h3>Vehicle #2</h3>
            <p>License Plate: 234-56-789</p>
            <p class="status">Inside Parking</p>
        </div>

        <div class="car">
            <img src="http://localhost:8081/images/car3.jpg"
                 alt="Car 3">
            <h3>Vehicle #3</h3>
            <p>License Plate: 345-67-890</p>
            <p class="status">Inside Parking</p>
        </div>

    </main>

</body>
</html>
